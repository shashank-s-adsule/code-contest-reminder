<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Contest Reminder</title>
  <link rel="stylesheet" href="popup.css" />
</head>

      Contest Reminder
    </span>
    <div class="header-actions">
      <button id="refresh-btn" class="icon-btn" title="Refresh">
        <svg class="icon-reload" viewBox="0 0 256 256" fill="none" aria-hidden="true">
          <path d="M194 105a70 70 0 1 0 0 46" stroke="currentColor" stroke-width="18" stroke-linecap="round"/>
          <path d="m193 65 3 42-40-12" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <a href="../options/options.html" target="_blank" class="icon-btn settings-btn" title="Settings">
        <svg class="icon-gear" viewBox="0 0 512 512" aria-hidden="true">
          <mask id="gear-hole-mask">
            <rect width="512" height="512" fill="#fff"/>
            <circle cx="256" cy="256" r="76" fill="#000"/>
          </mask>
          <g fill="currentColor" mask="url(#gear-hole-mask)">
            <circle cx="256" cy="256" r="171"/>
            <rect x="204" y="30" width="104" height="148" rx="15"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(45 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(90 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(135 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(180 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(225 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(270 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(315 256 256)"/>
          </g>
        </svg>
      </a>
    </div>
  </div>

  <div id="daily-section" class="daily-section hidden">
    <div class="daily-label">Daily Challenge</div>
    <div id="daily-cards" class="daily-cards">
      <!-- Populated by popup.js -->
    </div>
  </div>

  <div id="last-updated" class="last-updated">Fetching contests...</div>

  <div id="error-banner" class="error-banner hidden"></div>

  <div id="loading-state" class="loading-state hidden">
    <div class="spinner"></div>
    <p>Loading contests...</p>
  </div>

  <div id="contest-list" class="contest-list">
    <!-- Populated by popup.js -->
  </div>

  <div id="empty-state" class="empty-state hidden">
    <p>🎉 No upcoming contests right now.</p>
    <p class="sub">Check back later or enable more platforms in settings.</p>
  </div>
