<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contest Reminder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">
      <svg class="icon-trophy" viewBox="0 0 36 36" aria-hidden="true"><path fill="#FFAC33" d="M5.123 5h6C12.227 5 13 4.896 13 6V4c0-1.104-.773-2-1.877-2h-8c-2 0-3.583 2.125-3 5 0 0 1.791 9.375 1.917 9.958C2.373 18.5 4.164 20 6.081 20h6.958c1.105 0-.039-1.896-.039-3v-2c0 1.104-.773 2-1.877 2h-4c-1.104 0-1.833-1.042-2-2S3.539 7.667 3.539 7.667C3.206 5.75 4.018 5 5.123 5m25.812 0h-6C23.831 5 22 4.896 22 6V4c0-1.104 1.831-2 2.935-2h8c2 0 3.584 2.125 3 5 0 0-1.633 9.419-1.771 10-.354 1.5-2.042 3-4 3h-7.146C21.914 20 22 18.104 22 17v-2c0 1.104 1.831 2 2.935 2h4c1.104 0 1.834-1.042 2-2s1.584-7.333 1.584-7.333C32.851 5.75 32.04 5 30.935 5M20.832 22c0-6.958-2.709 0-2.709 0s-3-6.958-3 0-3.291 10-3.291 10h12.292c-.001 0-3.292-3.042-3.292-10"/><path fill="#FFCC4D" d="M29.123 6.577c0 6.775-6.77 18.192-11 18.192s-11-11.417-11-18.192c0-5.195 1-6.319 3-6.319 1.374 0 6.025-.027 8-.027l7-.001c2.917-.001 4 .684 4 6.347"/><path fill="#C1694F" d="M27 33c0 1.104.227 2-.877 2h-16C9.018 35 9 34.104 9 33v-1c0-1.104 1.164-2 2.206-2h13.917c1.042 0 1.877.896 1.877 2z"/><path fill="#C1694F" d="M29 34.625c0 .76.165 1.375-1.252 1.375H8.498C7.206 36 7 35.385 7 34.625v-.25C7 33.615 7.738 33 8.498 33h19.25c.759 0 1.252.615 1.252 1.375z"/></svg>
      Contest Reminder
    </span>
    <div class="header-actions">
      <button id="refresh-btn" class="icon-btn" title="Refresh">
        <svg class="icon-reload" viewBox="0 0 256 256" fill="none" aria-hidden="true">
          <path d="M194 105a70 70 0 1 0 0 46" stroke="currentColor" stroke-width="18" stroke-linecap="round"/>
          <path d="m193 65 3 42-40-12" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <a href="../options/options.html" target="_blank" class="icon-btn settings-btn" title="Settings">
        <svg class="icon-gear" viewBox="0 0 512 512" aria-hidden="true">
          <mask id="gear-hole-mask">
            <rect width="512" height="512" fill="#fff"/>
            <circle cx="256" cy="256" r="76" fill="#000"/>
          </mask>
          <g fill="currentColor" mask="url(#gear-hole-mask)">
            <circle cx="256" cy="256" r="171"/>
            <rect x="204" y="30" width="104" height="148" rx="15"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(45 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(90 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(135 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(180 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(225 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(270 256 256)"/>
            <rect x="204" y="30" width="104" height="148" rx="15" transform="rotate(315 256 256)"/>
          </g>
        </svg>
      </a>
    </div>
  </div>

  <div id="last-updated" class="last-updated">Fetching contests...</div>

  <div id="error-banner" class="error-banner hidden"></div>

  <div id="loading-state" class="loading-state hidden">
    <div class="spinner"></div>
    <p>Loading contests...</p>
  </div>

  <div id="contest-list" class="contest-list">
    <!-- Populated by popup.js -->
  </div>

  <div id="empty-state" class="empty-state hidden">
    <p>🎉 No upcoming contests right now.</p>
    <p class="sub">Check back later or enable more platforms in settings.</p>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
